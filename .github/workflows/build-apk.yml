name: Construire APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Inventaire_Echappee_BLE_Online.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Décompresser le projet
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -o Inventaire_Echappee_BLE_Online.zip -d buildsrc
          echo "Contenu extrait :"
          find buildsrc -maxdepth 3 -type f

      - name: Trouver le projet Android
        run: |
          PROJECT_DIR=$(find buildsrc -name settings.gradle -type f -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : settings.gradle introuvable"
            exit 1
          fi

          echo "Projet trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Trouver l'APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable"
            exit 1
          fi

          echo "APK trouvé : $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Inventaire-Echappee-APK
          path: ${{ env.APK }}
